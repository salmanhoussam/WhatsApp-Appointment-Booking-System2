<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RK Barber — Story Experience Lab (standalone, non-production)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="lab-controls">
    <div class="lab-badge">🧪 DESIGN LAB — Round 2 — not production</div>
    <label for="sourceSelect">Footage:</label>
    <select id="sourceSelect">
      <option value="original">Round 1 — original (casual/shaky)</option>
      <option value="genuine">Round 2 — new footage (calmer, re-edited)</option>
    </select>
    <label for="techniqueSelect">Rendering technique:</label>
    <select id="techniqueSelect">
      <option value="canvas">Canvas · direct scrub (scroll = progress, 1:1)</option>
      <option value="canvasTimeline">Canvas · timeline-driven (eased, scrub:0.5s catch-up)</option>
      <option value="nativeSeek">Native &lt;video&gt; · continuous seek</option>
      <option value="hybrid">Hybrid · native play/pause</option>
    </select>
    <pre id="stats">loading…</pre>
  </div>

  <section id="hero">
    <div class="hero-inner">
      <h1>RK Barber Shop</h1>
      <p>حلاقة رجالية احترافية</p>
      <div class="scroll-hint">اسكرول لتبدأ القصة ↓</div>
    </div>
  </section>

  <section id="story">
    <div id="storySticky">
      <canvas id="frameCanvas"></canvas>
      <video id="nativeVideo" muted playsinline preload="auto"></video>
      <div class="scrim"></div>
      <div id="overlayContainer"></div>
    </div>
  </section>

  <section id="after">
    <div class="after-inner">
      <h3>خدماتنا</h3>
      <p>(placeholder — real page continues with services/catalog/booking below the Story Experience)</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
